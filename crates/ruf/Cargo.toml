[package]
name = "ruf"
description = "RUF – Rust native UI Framework: Oberflächen mit GTK 4 auf Linux, Windows und macOS – Fundament für RNCL-Komponenten und Freya TD"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["gui", "native", "widgets", "ui", "rad"]
categories = ["gui"]

[dependencies]
regex = "1.13.1"

# GTK 4 auf allen Systemen (Linux, Windows, macOS). Unter Windows und macOS
# liefert das Release die GTK-Laufzeitdateien mit (siehe docs/de/release.md).
# GTK 4 on all systems; Windows and macOS releases ship the GTK runtime.
gtk4 = { version = "0.11.5", features = ["v4_12"] }
